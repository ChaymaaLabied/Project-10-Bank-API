swagger: "2.0"
info:
  title: Bank Argent API documentation
  description: Contains all available API endpoints in this codebase
  version: "1.0.0"
  termsOfService: "http://swagger.io/terms/"
host: localhost:3001
basePath: /api/v1
schemes:
  - http
paths:
  /user/login:
    post:
      tags:
        - User Module
      summary: Login
      description: API for Login
      parameters:
        - in: body
          name: body
          description: Login Payload
          required: true
          schema:
            $ref: "#/definitions/Login"
      produces:
        - application/json
      responses:
        "200":
          description: Login Successfully
          schema:
            $ref: "#/definitions/LoginResponse"
        "400":
          description: Invalid Fields
        "500":
          description: Internal Server Error

  /user/signup:
    post:
      tags:
        - User Module
      summary: Signup
      description: API for Signup
      parameters:
        - in: body
          name: body
          description: Signup Payload
          required: true
          schema:
            $ref: "#/definitions/User"
      produces:
        - application/json
      responses:
        "200":
          description: Signup Successfully
          schema:
            $ref: "#/definitions/ApiResponse"
        "400":
          description: Invalid Fields
        "500":
          description: Internal Server Error

  /transactions:
    get:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Find the Transactions of the current month
      description: API for fetching Transactions data of the current month (JWT token required)
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Get Transactions List Successfully
          schema:
            $ref: "#/definitions/TransactionsList"
        "400":
          description: Invalid Fields
        "500":
          description: Transactions not found

definitions:
  User:
    properties:
      email:
        type: string
        description: User email
      password:
        type: string
        description: User password
      firstName:
        type: string
        description: User first name
      lastName:
        type: string
        description: User last name

  Login:
    properties:
      email:
        type: string
        description: User email
      password:
        type: string
        description: User password

  LoginResponse:
    type: object
    properties:
      token:
        type: string

  ApiResponse:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      body:
        type: object
        properties:
          id:
            type: string
          email:
            type: string

  TransactionsList:
    type: object
    properties:
      transactions:
        type: array
        items:
          $ref: "#/definitions/Transaction"
      total:
        type: integer

  Transaction:
    type: object
    required:
      - transactionId
      - date
      - amount
      - type
      - description
    properties:
      transactionId:
        type: integer
        description: "Transaction ID, cannot be modified or deleted"
      date:
        type: string
        format: date
        description: "Transaction date, cannot be modified or deleted"
      amount:
        type: number
        description: "Transaction amount, cannot be modified or deleted"
      type:
        type: string
        enum:
          - income
          - expense
        description: "Type of transaction"
      description:
        type: string
        description: "Description of the transaction"
      status:
        type: string
        description: "Current status of the transaction (e.g., completed, pending)"

  TransactionDetails:
    type: object
    properties:
      transactionId:
        type: integer
        description: "Transaction ID, cannot be modified or deleted"
      date:
        type: string
        format: date
        description: "Transaction date, cannot be modified or deleted"
      amount:
        type: number
        description: "Transaction amount, cannot be modified or deleted"
      type:
        type: string
      description:
        type: string
      category:
        type: string
      status:
        type: string
      extraField:
        type: string
        description: "Additional information associated with the transaction"
